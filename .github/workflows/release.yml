name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew clean build :api:build --no-daemon
      - run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      - name: Create or refresh GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          artifacts=("build/libs/mColor-${version}.jar" "api/build/libs/mColor-API-${version}.jar")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" --title "$tag" --notes-file CHANGELOG.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
